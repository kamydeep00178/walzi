// Compose compiler stability configuration (see composeCompiler {} in build.gradle.kts).
//
// These classes are immutable by convention: `val` properties only, and their Lists/Sets are
// never mutated after construction (state updates always build new ones via copy()). Declaring
// them stable lets Compose skip recomposing composables whose parameters are unchanged, instead
// of treating every List-holding model as "might have changed".

// Domain models: Wallpaper, Category, WallpaperList, ...
com.yunok.walzi.domain.model.*

// MVI state / intent / effect classes and per-screen models (HomeState, TabState, PlaylistPreview, ...)
com.yunok.walzi.presentation.**

// Kotlin's read-only collection interfaces
kotlin.collections.*
